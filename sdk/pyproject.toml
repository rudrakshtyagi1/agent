[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-local-sdk"
version = "0.1.0"
description = "Explicit Python trace instrumentation and export for AgentGuard"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentguard*"]
