name: Test and build
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt -e ./sdk
      - run: python -m pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Compare agent versions and enforce release gate
        run: python scripts/check_release.py --output release-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentguard-release-report
          path: release-report.json
          if-no-files-found: warn
